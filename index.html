<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveCakes. 💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #2b1b22;
    }

    .juego-container {
      width: 100%;
      max-width: 420px;
      height: 600px;
      background-color: #ffd1dc;
      border: 4px solid #ffb7c5;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(255, 183, 197, 0.4);
      text-align: center;
    }

    /* 1. PANTALLA INICIO CON NUBECITA PIXELEADA */
    .pantalla-inicio {
      width: 100%;
      height: 100%;
      background-color: #2b1b22;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .img-portada {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Botón Nubecita Pixeleada Animada */
    @keyframes flotarNubecita {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-6px) scale(1.05); }
      100% { transform: translateY(0px) scale(1); }
    }

    .btn-start-nube {
      position: absolute;
      left: 4%; /* Movido bien a la izquierda para no tapar al personaje */
      top: 38%;
      background-color: #ffb6c1;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 12px 20px;
      cursor: pointer;
      text-shadow: 2px 2px 0px #d87093;
      border: 3px solid #ffffff;
      
      /* Estilo bordes tipo Nube Pixeleada */
      border-radius: 20px;
      box-shadow: 
        0 5px 0px #d87093,
        inset -3px -3px 0px #ff94b4,
        inset 3px 3px 0px #ffffff;

      animation: flotarNubecita 2s infinite ease-in-out;
      z-index: 10;
    }

    .btn-start-nube:hover {
      background-color: #ffc0cb;
    }

    .btn-start-nube:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0px #d87093;
    }

    /* 2. PRESENTACIÓN */
    .pantalla-presentacion {
      width: 100%;
      height: 100%;
      background-color: #2b1b22;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .img-personaje {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* 3. GIF COMPLETO CON BOTÓN ENCIMA */
    .pantalla-cargando {
      width: 100%;
      height: 100%;
      position: relative;
      background-color: #2b1b22;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gif-cargando {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @keyframes pulsoBtn {
      0% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.08); }
      100% { transform: translateX(-50%) scale(1); }
    }

    .btn-click-love {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(43, 27, 34, 0.9);
      color: #ffd1dc;
      border: 2px solid #ff94b4;
      padding: 12px 35px;
      font-size: 1.2rem;
      font-family: inherit;
      font-weight: bold;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      animation: pulsoBtn 1.5s infinite ease-in-out;
      z-index: 10;
    }

    .btn-click-love:active {
      transform: translateX(-50%) translateY(3px);
      box-shadow: 0 0 0 #1a0f14;
    }

    /* 4. SELECCIÓN DE PAN */
    .pantalla-pan {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      padding: 20px;
    }

    .opciones-colores {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }

    .btn-color-pan {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .btn-color-pan:hover {
      transform: scale(1.1);
    }

    .oculto {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="juego-container">
    
    <!-- 1. PANTALLA INICIO -->
    <div id="paso-1" class="pantalla-inicio">
      <img src="https://i.ibb.co/4Z6bKZgY/Love-Cakes.jpg" alt="LoveCakes Portada" class="img-portada">
      <button class="btn-start-nube" onclick="irAPresentacion()">Start!</button>
    </div>

    <!-- 2. PRESENTACIÓN -->
    <div id="paso-2" class="pantalla-presentacion oculto" onclick="irAGif()">
      <img src="https://i.ibb.co/d41f8g6d/enjoy.jpg" alt="Presentación Personaje" class="img-personaje">
    </div>

    <!-- 3. GIF COMPLETO CON EL BOTÓN "Click!💕" -->
    <div id="paso-3" class="pantalla-cargando oculto">
      <img src="https://i.ibb.co/67jG6M16/GIFLOVE.gif" alt="GIF LoveCakes" class="gif-cargando">
      <button class="btn-click-love" onclick="irAJuego()">Click!💕</button>
    </div>

    <!-- 4. SELECCIÓN DE PAN -->
    <div id="paso-4" class="pantalla-pan oculto">
      <h3>Elige el sabor del pan:</h3>
      <div class="opciones-colores">
        <button class="btn-color-pan" style="background-color: #5c3826;" title="Chocolate" onclick="seleccionarPan('Chocolate')"></button>
        <button class="btn-color-pan" style="background-color: #f7e0a3;" title="Vainilla" onclick="seleccionarPan('Vainilla')"></button>
        <button class="btn-color-pan" style="background-color: #a82e3e;" title="Red Velvet" onclick="seleccionarPan('Red Velvet')"></button>
      </div>
    </div>

  </div>

  <script>
    function irAPresentacion() {
      document.getElementById('paso-1').classList.add('oculto');
      document.getElementById('paso-2').classList.remove('oculto');
    }

    function irAGif() {
      document.getElementById('paso-2').classList.add('oculto');
      document.getElementById('paso-3').classList.remove('oculto');
    }

    function irAJuego() {
      document.getElementById('paso-3').classList.add('oculto');
      document.getElementById('paso-4').classList.remove('oculto');
    }

    function seleccionarPan(color) {
      alert("¡Elegiste el pan sabor " + color + "!");
    }
  </script>

</body>
</html>
