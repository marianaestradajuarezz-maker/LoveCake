<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveCakes 🧁</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #2b1b22;
    }

    .juego-container {
      width: 100%;
      max-width: 420px;
      height: 600px;
      background-color: #ffd1dc;
      border: 4px solid #ffb7c5;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(255, 183, 197, 0.4);
      text-align: center;
    }

    /* 1. PANTALLA INICIO CON FONDO COMPLETO */
    .pantalla-inicio {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .img-portada {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Botón invisible sobre el recuadro 'start!' */
    .btn-start-invisible {
      position: absolute;
      left: 7%;
      top: 36%;
      width: 28%;
      height: 17%;
      background: rgba(255, 255, 255, 0);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      animation: pulsoInvis 1.5s infinite ease-in-out;
    }

    @keyframes pulsoInvis {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .btn-start-invisible:active {
      transform: scale(0.95);
    }

    /* 2. PRESENTACIÓN DE TU PERSONAJE (CLICKEABLE EN TODA LA PANTALLA) */
    .pantalla-presentacion {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: pointer;
    }

    .img-personaje {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 3. GIF CON BOTÓN FÍSICO Click!💕 */
    .pantalla-cargando {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 25px;
      background-color: #ffd1dc;
    }

    .gif-cargando {
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 15px;
    }

    @keyframes pulsoBtn {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .btn-click-love {
      background-color: #2b1b22;
      color: #ffd1dc;
      border: 2px solid #ff94b4;
      padding: 12px 35px;
      font-size: 1.2rem;
      font-family: inherit;
      font-weight: bold;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 4px 0 #1a0f14;
      animation: pulsoBtn 1.5s infinite ease-in-out;
      margin-bottom: 10px;
    }

    .btn-click-love:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 #1a0f14;
    }

    /* 4. SELECCIÓN DE PAN (JUEGO) */
    .pantalla-pan {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      padding: 20px;
    }

    .opciones-colores {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }

    .btn-color-pan {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .btn-color-pan:hover {
      transform: scale(1.1);
    }

    .oculto {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="juego-container">
    
    <!-- 1. PANTALLA INICIO CON TU PORTADA COMPLETA -->
    <div id="paso-1" class="pantalla-inicio">
      <img src="https://i.ibb.co/4RqMF81V/Love-Cakes.jpg" alt="LoveCakes Portada" class="img-portada">
      <button class="btn-start-invisible" onclick="irAPresentacion()"></button>
    </div>

    <!-- 2. PRESENTACIÓN DE TU PERSONAJE (CLIC EN CUALQUIER PARTE DE LA PANTALLA) -->
    <div id="paso-2" class="pantalla-presentacion oculto" onclick="irAGif()">
      <img src="https://i.ibb.co/d41f8g6d/enjoy.jpg" alt="Presentación Personaje" class="img-personaje">
    </div>

    <!-- 3. GIF CON EL BOTÓN "Click!💕" -->
    <div id="paso-3" class="pantalla-cargando oculto">
      <img src="https://i.ibb.co/67jG6M16/GIFLOVE.gif" alt="GIF LoveCakes" class="gif-cargando">
      <button class="btn-click-love" onclick="irAJuego()">Click!💕</button>
    </div>

    <!-- 4. SELECCIÓN DE PAN -->
    <div id="paso-4" class="pantalla-pan oculto">
      <h3>Elige el sabor del pan:</h3>
      <div class="opciones-colores">
        <button class="btn-color-pan" style="background-color: #5c3826;" title="Chocolate" onclick="seleccionarPan('Chocolate')"></button>
        <button class="btn-color-pan" style="background-color: #f7e0a3;" title="Vainilla" onclick="seleccionarPan('Vainilla')"></button>
        <button class="btn-color-pan" style="background-color: #a82e3e;" title="Red Velvet" onclick="seleccionarPan('Red Velvet')"></button>
      </div>
    </div>

  </div>

  <script>
    // Ir de la Portada a la Presentación
    function irAPresentacion() {
      document.getElementById('paso-1').classList.add('oculto');
      document.getElementById('paso-2').classList.remove('oculto');
    }

    // Ir de la Presentación al GIF (al tocar cualquier parte)
    function irAGif() {
      document.getElementById('paso-2').classList.add('oculto');
      document.getElementById('paso-3').classList.remove('oculto');
    }

    // Ir del GIF a la Selección del Pan (al dar clic en "Click!💕")
    function irAJuego() {
      document.getElementById('paso-3').classList.add('oculto');
      document.getElementById('paso-4').classList.remove('oculto');
    }

    function seleccionarPan(color) {
      alert("¡Elegiste el pan sabor " + color + "!");
    }
  </script>

</body>
</html>
