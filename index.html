<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveCakes. 🧁</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #2b1b22;
      overflow: hidden;
    }

    .juego-container {
      width: 100%;
      max-width: 420px;
      height: 600px;
      background-color: #ffd1dc;
      border: 4px solid #ffb7c5;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(255, 183, 197, 0.4);
      text-align: center;
    }

    /* 🌧️ LLUVIA DE BRILLITOS INICIAL ✨ */
    .brillito {
      position: absolute;
      top: -30px;
      font-size: 1.2rem;
      user-select: none;
      pointer-events: none;
      z-index: 20;
      animation: caerBrillo linear infinite;
    }

    @keyframes caerBrillo {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(630px) rotate(360deg);
        opacity: 0.2;
      }
    }

    /* ✨ RÁFAGA DE BRILLITOS AL DAR CLIC ✨ */
    .brillo-click {
      position: absolute;
      font-size: 1.5rem;
      user-select: none;
      pointer-events: none;
      z-index: 40;
      animation: animBrilloClick 0.8s ease-out forwards;
    }

    @keyframes animBrilloClick {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.5);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(1.4);
      }
    }

    /* 1. PANTALLA INICIO */
    .pantalla-inicio {
      width: 100%;
      height: 100%;
      background-color: #2b1b22;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .img-portada {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @keyframes flotarNubecita {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-6px) scale(1.05); }
      100% { transform: translateY(0px) scale(1); }
    }

    .btn-start-nube {
      position: absolute;
      left: 4%;
      top: 38%;
      background-color: #ffb6c1;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 12px 20px;
      cursor: pointer;
      text-shadow: 2px 2px 0px #d87093;
      border: 3px solid #ffffff;
      border-radius: 20px;
      box-shadow: 
        0 5px 0px #d87093,
        inset -3px -3px 0px #ff94b4,
        inset 3px 3px 0px #ffffff;
      animation: flotarNubecita 2s infinite ease-in-out;
      z-index: 10;
    }

    /* 2. PRESENTACIÓN DE MARIANITA */
    .pantalla-presentacion {
      width: 100%;
      height: 100%;
      background-color: #2b1b22;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .img-personaje {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @keyframes flotarTexto {
      0% { transform: translateX(-50%) translateY(0px); }
      50% { transform: translateX(-50%) translateY(-7px); }
      100% { transform: translateX(-50%) translateY(0px); }
    }

    .cuadro-dialogo-marianita {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      width: 82%;
      background-color: rgba(255, 255, 255, 0.95);
      border: 3px solid #ff94b4;
      border-radius: 20px;
      padding: 14px 18px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.05rem;
      font-weight: bold;
      color: #2b1b22;
      box-shadow: 0 6px 15px rgba(216, 112, 147, 0.3);
      animation: flotarTexto 2.2s infinite ease-in-out;
      z-index: 10;
      text-align: center;
    }

    .cuadro-dialogo-marianita::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 12px 10px 0;
      border-style: solid;
      border-color: #ff94b4 transparent;
      display: block;
      width: 0;
    }

    /* 3. GIF COMPLETO */
    .pantalla-cargando {
      width: 100%;
      height: 100%;
      position: relative;
      background-color: #2b1b22;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gif-cargando {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @keyframes pulsoBtn {
      0% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.08); }
      100% { transform: translateX(-50%) scale(1); }
    }

    .btn-click-love {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(43, 27, 34, 0.9);
      color: #ffd1dc;
      border: 2px solid #ff94b4;
      padding: 12px 35px;
      font-size: 1.2rem;
      font-family: inherit;
      font-weight: bold;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      animation: pulsoBtn 1.5s infinite ease-in-out;
      z-index: 10;
    }

    /* 4. SELECCIÓN DE PAN SOBRE EL ESCENARIO */
    .pantalla-pan {
      width: 100%;
      height: 100%;
      position: relative;
      background-color: #2b1b22;
    }

    .img-escenario {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Zonas transparentes para hacer clic en las 3 opciones */
    .area-btn-pan {
      position: absolute;
      bottom: 2%;
      width: 30%;
      height: 25%;
      cursor: pointer;
      border-radius: 15px;
      z-index: 25;
    }

    .area-btn-pan:active {
      transform: scale(0.95);
    }

    .btn-chocolate { left: 3%; }
    .btn-vainilla { left: 35%; }
    .btn-fresa { left: 67%; }

    /* GIF DEL OSITO CUBRIENDO CASI TODA LA PANTALLA */
    .gif-osito-preparando {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 380px;
      height: auto;
      z-index: 20; /* Por delante del pastel */
      pointer-events: none;
    }

    /* PASTEL MÁS GRANDE EN LA MESA */
    .img-pastel-mesa {
      position: absolute;
      top: 32%;
      left: 50%;
      transform: translateX(-50%);
      width: 250px; /* ¡MÁS GRANDE! */
      height: auto;
      z-index: 10; /* Detrás del osito */
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.3));
      transition: opacity 0.3s ease;
    }

    .oculto {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="juego-container" id="contenedor-juego">
    
    <!-- 1. PANTALLA INICIO -->
    <div id="paso-1" class="pantalla-inicio">
      <img src="https://i.ibb.co/4Z6bKZgY/Love-Cakes.jpg" alt="LoveCakes Portada" class="img-portada">
      <button class="btn-start-nube" onclick="irAPresentacion()">Start!</button>
    </div>

    <!-- 2. PRESENTACIÓN DE MARIANITA -->
    <div id="paso-2" class="pantalla-presentacion oculto" onclick="irAGif()">
      <img src="https://i.ibb.co/LX1CcHvz/SI.jpg" alt="Marianita LoveCakes" class="img-personaje">
      <div class="cuadro-dialogo-marianita">
        Soy Marianita, ¡que te diviertas! 💕
      </div>
    </div>

    <!-- 3. GIF COMPLETO -->
    <div id="paso-3" class="pantalla-cargando oculto">
      <img src="https://i.ibb.co/67jG6M16/GIFLOVE.gif" alt="GIF LoveCakes" class="gif-cargando">
      <button class="btn-click-love" onclick="irAJuego()">Click!💕</button>
    </div>

    <!-- 4. SELECCIÓN DE PAN SOBRE EL ESCENARIO -->
    <div id="paso-4" class="pantalla-pan oculto">
      <img src="https://i.ibb.co/KpCMGLn2/escenario.jpg" alt="Escenario LoveCakes" class="img-escenario">

      <!-- Imagen del pastel elegido (Detrás del osito) -->
      <img id="pastel-mesa" src="" alt="Pastel" class="img-pastel-mesa oculto">

      <!-- GIF del Osito Gigante (Por delante) -->
      <img id="gif-osito" src="https://i.ibb.co/NgMVcv8d/beso-ezgif-com-remove-background.gif" alt="Preparando..." class="gif-osito-preparando oculto">

      <!-- Botones transparentes (Izquierda a Derecha) -->
      <div class="area-btn-pan btn-chocolate" onclick="seleccionarPan('https://i.ibb.co/ynBwVJsp/chocolate-removebg-preview.png', event)"></div>
      <div class="area-btn-pan btn-vainilla" onclick="seleccionarPan('https://i.ibb.co/QFgZ5BhM/vainilla-removebg-preview.png', event)"></div>
      <div class="area-btn-pan btn-fresa" onclick="seleccionarPan('https://i.ibb.co/B5Pb5L44/fresa-removebg-preview.png', event)"></div>
    </div>

  </div>

  <script>
    let intervaloBrillitos;

    function crearLluviaBrillitos() {
      const contenedor = document.getElementById('contenedor-juego');
      intervaloBrillitos = setInterval(() => {
        const brillo = document.createElement('div');
        brillo.classList.add('brillito');
        brillo.innerHTML = '✨';
        brillo.style.left = Math.random() * 92 + '%';
        brillo.style.animationDuration = (Math.random() * 3 + 3) + 's';
        contenedor.appendChild(brillo);

        setTimeout(() => brillo.remove(), 6000);
      }, 400);
    }

    function detenetLluviaBrillitos() {
      clearInterval(intervaloBrillitos);
      document.querySelectorAll('.brillito').forEach(b => b.remove());
    }

    crearLluviaBrillitos();

    function irAPresentacion() {
      document.getElementById('paso-1').classList.add('oculto');
      document.getElementById('paso-2').classList.remove('oculto');
    }

    function irAGif() {
      document.getElementById('paso-2').classList.add('oculto');
      document.getElementById('paso-3').classList.remove('oculto');
    }

    function irAJuego() {
      detenetLluviaBrillitos();
      document.getElementById('paso-3').classList.add('oculto');
      document.getElementById('paso-4').classList.remove('oculto');
    }

    function seleccionarPan(urlPastel, event) {
      // 1. Brillitos ✨ saliendo del botón
      const rect = event.target.getBoundingClientRect();
      const contenedorRect = document.getElementById('contenedor-juego').getBoundingClientRect();
      
      const x = rect.left - contenedorRect.left + rect.width / 2;
      const y = rect.top - contenedorRect.top + rect.height / 2;

      for (let i = 0; i < 10; i++) {
        const b = document.createElement('div');
        b.classList.add('brillo-click');
        b.innerHTML = '✨';
        b.style.left = x + 'px';
        b.style.top = y + 'px';
        
        const tx = (Math.random() - 0.5) * 140 + 'px';
        const ty = (Math.random() - 0.5) * 140 - 40 + 'px';
        b.style.setProperty('--tx', tx);
        b.style.setProperty('--ty', ty);

        document.getElementById('contenedor-juego').appendChild(b);
        setTimeout(() => b.remove(), 800);
      }

      const osito = document.getElementById('gif-osito');
      const pastelMesa = document.getElementById('pastel-mesa');

      // 2. Muestra el Osito Gigante inmediatamente
      pastelMesa.classList.add('oculto');
      osito.classList.remove('oculto');

      // 3. Al 1er segundo (1000ms), aparece el pastel ATRÁS del osito
      setTimeout(() => {
        pastelMesa.src = urlPastel;
        pastelMesa.classList.remove('oculto');
      }, 1000);

      // 4. A los 2 segundos (2000ms), desaparece el osito y queda el pastel
      setTimeout(() => {
        osito.classList.add('oculto');
      }, 2000);
    }
  </script>

</body>
</html>
